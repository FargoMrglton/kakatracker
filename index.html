<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Какатрекер</title>
<meta name="theme-color" content="#7A4B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Какатрекер">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#3B2414; --muted:#8A6F5A; --line:#F0E2CF;
  --brown:#7A4B26; --brown2:#A0662F; --accent:#E8A23A; --ok:#4E9A5B; --warn:#D9822B; --bad:#C2453A;
  --me:rgba(232,162,58,.16); --shadow:0 6px 24px rgba(122,75,38,.10);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1C140E; --card:#271C14; --ink:#F6E9DA; --muted:#B39A84; --line:#3A2B1F;
    --brown:#E0A86A; --brown2:#C98A4B; --accent:#F0B550; --me:rgba(240,181,80,.14); --shadow:0 6px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.2px}
.who{font-size:13px;color:var(--muted);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{text-align:center;padding:24px 16px 20px}
.label{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
.timer{display:flex;justify-content:center;gap:8px;margin:14px 0 10px}
.unit{min-width:64px}
.num{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--brown)}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.sep{font-size:38px;font-weight:700;color:var(--line);line-height:1.05}
.status{display:inline-block;margin-top:6px;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;background:var(--line)}
.status.ok{background:rgba(78,154,91,.14);color:var(--ok)}
.status.warn{background:rgba(217,130,43,.15);color:var(--warn)}
.status.bad{background:rgba(194,69,58,.14);color:var(--bad)}
.since{font-size:13px;color:var(--muted);margin-top:10px}
.empty{font-size:18px;margin:18px 0 6px;color:var(--muted)}
.big{display:block;width:100%;border:0;border-radius:20px;padding:20px;font:inherit;font-size:22px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#B9773A,#7A4B26);box-shadow:0 8px 0 #5A3519,0 12px 24px rgba(90,53,25,.3);transition:transform .08s,box-shadow .08s;margin:4px 0 18px}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #5A3519,0 6px 12px rgba(90,53,25,.3)}
.big:disabled{opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:26px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}
.tile .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.main{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between}
.tile.main .v{font-size:38px}
details{margin-bottom:14px}
summary{cursor:pointer;color:var(--brown2);font-size:14px;font-weight:500;list-style:none;padding:4px 2px}
summary::-webkit-details-marker{display:none}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:12px;padding:12px 16px;background:var(--brown);color:#fff;cursor:pointer}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn.ghost{background:transparent;color:var(--brown2);border:1px solid var(--line)}
.btn:disabled{opacity:.6}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:1px;line-height:1.4}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.when{font-size:15px}
.gap{font-size:12.5px;color:var(--muted);margin-top:2px}
.del{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.del.sure{background:rgba(194,69,58,.12);color:var(--bad);font-weight:500}
.more{text-align:center;margin-top:8px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
.banner{background:var(--me);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.4}
.banner .row{margin-top:10px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;max-width:170px;border:0;background:transparent;font:inherit;font-size:12px;color:var(--muted);padding:6px 4px;border-radius:12px;cursor:pointer}
.tabs button b{display:block;font-size:22px;line-height:1.2}
.tabs button.on{color:var(--brown);font-weight:700;background:var(--me)}
/* auth */
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:15px;padding:10px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.hint{font-size:12px;color:var(--muted);margin:5px 0 0 2px}
.logo{text-align:center;font-size:64px;margin:18px 0 4px}
.tag{text-align:center;color:var(--muted);margin:0 0 20px;font-size:15px}
/* leaderboard */
.sorts{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.sorts button{flex:none;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;color:var(--ink);cursor:pointer}
.sorts button.on{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:500}
.king{text-align:center;padding:20px 16px}
.king .crown{font-size:44px}
.king .t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-top:4px}
.king .n{font-size:26px;font-weight:800;margin:4px 0 2px;word-break:break-word}
.king .s{font-size:14px;color:var(--muted)}
.board li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px}
.board li + li{border-top:1px solid var(--line)}
.board li.me{background:var(--me);border-top-color:transparent}
.board li.me + li{border-top-color:transparent}
.rank{flex:none;width:34px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
.pl{flex:1;min-width:0}
.pl .nm{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm i{font-style:normal;font-size:12px;color:var(--brown2);font-weight:500;margin-left:4px}
.pl .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.sc{flex:none;text-align:right}
.sc .v{font-size:22px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.sc .u{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:8;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}}
.center{text-align:center;color:var(--muted);padding:60px 10px;line-height:1.5}
.setup ol{padding-left:20px;line-height:1.55;font-size:14.5px}
code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:13px}
@media (max-width:380px){.num{font-size:36px}.unit{min-width:52px}.sep{font-size:30px}}
</style>
</head>
<body>
<div id="app"><div class="center">Загрузка… 💩</div></div>

<script type="module">
/* =====================================================================
   НАСТРОЙКА: вставь сюда firebaseConfig из консоли Firebase
   (Project settings → General → Your apps → Web app → SDK setup and configuration → Config)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2rZIYEhjTDEwRVV84EKQiY9cF7QuG5VY",
  authDomain: "kakatracker.firebaseapp.com",
  projectId: "kakatracker",
  storageBucket: "kakatracker.firebasestorage.app",
  messagingSenderId: "620668253002",
  appId: "1:620668253002:web:ada73fc7ae40a187a147b3"
};
/* ===================================================================== */

const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const LOGIN_DOMAIN = '@kakatracker.app';
const LEGACY_LS = 'kakatracker-state';
const MIGRATED_LS = 'kakatracker-migrated';

const app = document.getElementById('app');

/* ---------- helpers ---------- */
function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10;
  if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
const pad = n => (n < 10 ? '0' : '') + n;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = arr => (Array.isArray(arr) ? arr : []).map(Number).filter(t => isFinite(t) && t > 0);
function split(ms){ const s = Math.max(0, Math.floor(ms/1000));
  return { d: Math.floor(s/86400), h: Math.floor(s%86400/3600), m: Math.floor(s%3600/60), s: s%60 }; }
function human(ms){ const p = split(ms);
  if (p.d > 0) return p.d + ' ' + plural(p.d,'день','дня','дней') + (p.h ? ' ' + p.h + ' ч' : '');
  if (p.h > 0) return p.h + ' ч' + (p.m ? ' ' + p.m + ' мин' : '');
  if (p.m > 0) return p.m + ' мин';
  return 'меньше минуты'; }
function compact(ms){ const p = split(ms);
  if (p.d > 0) return p.d + 'д ' + p.h + 'ч';
  if (p.h > 0) return p.h + 'ч ' + pad(p.m) + 'м';
  return p.m + 'м ' + pad(p.s) + 'с'; }
function shortH(ms){ const h = ms/3600000; if (h >= 48) return (h/24).toFixed(1).replace('.', ','); return h >= 10 ? Math.round(h) : h.toFixed(1).replace('.', ','); }
const shortUnit = ms => ms/3600000 >= 48 ? 'дн' : 'ч';
const fmtDay = new Intl.DateTimeFormat('ru-RU', { weekday:'short', day:'numeric', month:'long' });
const fmtTime = new Intl.DateTimeFormat('ru-RU', { hour:'2-digit', minute:'2-digit' });
const dayKey = t => { const d = new Date(t); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); };
function whenText(t){
  const now = new Date(), k = dayKey(t), y = new Date(now); y.setDate(now.getDate()-1);
  const day = k === dayKey(now) ? 'Сегодня' : k === dayKey(y) ? 'Вчера' : fmtDay.format(new Date(t));
  return day.charAt(0).toUpperCase() + day.slice(1) + ', ' + fmtTime.format(new Date(t));
}
function status(ms){
  const h = ms/3600000;
  if (h < 8)  return ['ok',  'Свежак. Всё под контролем ✨'];
  if (h < 24) return ['ok',  'Штатный режим 👌'];
  if (h < 36) return ['warn','Организм думает 🤔'];
  if (h < 48) return ['warn','Пора бы уже… 🫠'];
  if (h < 72) return ['bad', 'Тревожно 😬 Вода, клетчатка, движение'];
  return ['bad','Больше 3 дней — стоит спросить врача 🩺'];
}
function calc(events){
  const ev = clean(events).sort((a,b) => a-b), now = Date.now(), n = ev.length;
  const last = n ? ev[n-1] : null, gaps = [];
  for (let i = 1; i < n; i++) gaps.push(ev[i]-ev[i-1]);
  const cur = last != null ? Math.max(0, now - last) : 0;
  const record = Math.max(0, cur, ...gaps);
  const avg = gaps.length ? gaps.reduce((a,b) => a+b, 0)/gaps.length : null;
  const today = ev.filter(t => dayKey(t) === dayKey(now)).length;
  const week = ev.filter(t => t >= now - 7*86400000).length;
  return { n, last, cur, record, avg, today, week, ev };
}
function authError(e){
  const c = (e && e.code) || '';
  if (c.includes('email-already-in-use')) return 'Такой логин уже занят — выбери другой или войди.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Неверный логин или пароль.';
  if (c.includes('weak-password')) return 'Пароль слишком простой — минимум 6 символов.';
  if (c.includes('too-many-requests')) return 'Слишком много попыток. Подожди пару минут.';
  if (c.includes('network-request-failed') || c.includes('unavailable')) return 'Нет связи с сервером. Проверь интернет (в России может понадобиться VPN).';
  if (c.includes('operation-not-allowed') || c.includes('configuration-not-found')) return 'В Firebase не включён вход по Email/паролю (Authentication → Sign-in method).';
  if (c.includes('permission-denied')) return 'Сервер не пустил. Проверь правила Firestore (Rules).';
  if (c.includes('invalid-api-key') || c.includes('api-key-not-valid')) return 'Неверный apiKey в настройках сайта.';
  return 'Ошибка: ' + (c || (e && e.message) || 'неизвестно');
}
function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }

/* ---------- not configured ---------- */
if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('ВСТАВЬ')) {
  app.innerHTML = '<div class="wrap"><div class="logo">💩</div><div class="tag">Какатрекер ещё не подключён к серверу</div>' +
    '<div class="card setup"><h2>Что сделать владельцу сайта</h2><ol>' +
    '<li>Создай проект на <b>console.firebase.google.com</b>.</li>' +
    '<li>Authentication → Sign-in method → включи <b>Email/Password</b>.</li>' +
    '<li>Firestore Database → Create database → вкладка Rules → вставь правила из инструкции.</li>' +
    '<li>Project settings → Your apps → Web (<code>&lt;/&gt;</code>) → скопируй <code>firebaseConfig</code>.</li>' +
    '<li>Вставь его в начало этого файла вместо <code>ВСТАВЬ_СЮДА</code>.</li></ol></div></div>';
  throw new Error('not configured');
}

/* ---------- load Firebase ---------- */
let fa, fs;
try {
  const [appM, authM, fsM] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  const fbApp = appM.initializeApp(FIREBASE_CONFIG);
  fa = { ...authM, auth: authM.getAuth(fbApp) };
  fs = { ...fsM, db: fsM.getFirestore(fbApp) };
} catch (e) {
  app.innerHTML = '<div class="wrap"><div class="logo">🚧</div><div class="center" style="padding-top:10px">Не получилось подключиться к серверу.<br>' +
    'Проверь интернет. В России может понадобиться VPN.<br><br><button class="btn" onclick="location.reload()">Попробовать ещё раз</button></div></div>';
  throw e;
}

/* ---------- state ---------- */
let me = null;              // { uid, login }
let users = {};             // uid -> { name, login, events }
let loaded = false, unsub = null, profileEnsured = false, pendingName = '';
let view = 'me', sortBy = 'total', mode = 'login', authBusy = false, authErr = '', fatal = '';
let pastOpen = false, showAll = false, armed = null, nameMsg = '';

const myDoc = () => fs.doc(fs.db, 'users', me.uid);
const myData = () => (me && users[me.uid]) || null;
const nameOf = u => (u && (u.name || u.login)) || 'Аноним';

/* ---------- auth ---------- */
fa.onAuthStateChanged(fa.auth, user => {
  if (unsub) { unsub(); unsub = null; }
  users = {}; loaded = false; profileEnsured = false; fatal = ''; armed = null;
  if (!user) { me = null; render(); return; }
  me = { uid: user.uid, login: (user.email || '').replace(LOGIN_DOMAIN, '') };
  unsub = fs.onSnapshot(fs.collection(fs.db, 'users'), { includeMetadataChanges: false }, snap => {
    const next = {};
    snap.forEach(d => { next[d.id] = d.data(); });
    users = next; loaded = true;
    if (!users[me.uid] && !profileEnsured && !snap.metadata.fromCache) ensureProfile();
    render();
  }, err => { fatal = authError(err); render(); });
  render();
});

function ensureProfile(){
  profileEnsured = true;
  const data = { name: (pendingName || me.login).slice(0, 24), login: me.login, createdAt: Date.now() };
  fs.setDoc(myDoc(), data, { merge: true }).catch(e => { fatal = authError(e); render(); });
}

async function doAuth(){
  const login = (document.getElementById('login').value || '').trim().toLowerCase();
  const pass = document.getElementById('pass').value || '';
  const nameEl = document.getElementById('dname');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!/^[a-z0-9_.-]{3,20}$/.test(login)) { authErr = 'Логин: 3–20 символов, латиница, цифры, точка, _ или -'; render(); return; }
  if (pass.length < 6) { authErr = 'Пароль — минимум 6 символов.'; render(); return; }
  if (mode === 'register' && !name) { authErr = 'Придумай имя для рейтинга.'; render(); return; }
  authBusy = true; authErr = ''; render();
  try {
    if (mode === 'register') {
      pendingName = name;
      await fa.createUserWithEmailAndPassword(fa.auth, login + LOGIN_DOMAIN, pass);
    } else {
      await fa.signInWithEmailAndPassword(fa.auth, login + LOGIN_DOMAIN, pass);
    }
  } catch (e) { authErr = authError(e); }
  authBusy = false; render();
}

/* ---------- writes ---------- */
function addPoop(ts){
  fs.setDoc(myDoc(), { events: fs.arrayUnion(ts), login: me.login }, { merge: true })
    .catch(e => showToast(authError(e)));
}
function removePoop(ts){
  fs.updateDoc(myDoc(), { events: fs.arrayRemove(ts) }).catch(e => showToast(authError(e)));
}
function legacyEvents(){
  if (lsGet(MIGRATED_LS)) return [];
  try { const s = JSON.parse(lsGet(LEGACY_LS) || 'null'); return s ? clean(s.events) : []; } catch(e) { return []; }
}

/* ---------- toast & burst ---------- */
let toastTimer = null;
function showToast(msg){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2600);
}
function burst(x, y){
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('div'); b.className = 'burst'; b.textContent = i % 3 ? '💩' : '✨';
    const a = Math.random()*Math.PI*2, r = 80 + Math.random()*90;
    b.style.left = (x-15) + 'px'; b.style.top = (y-15) + 'px';
    b.style.setProperty('--dx', Math.cos(a)*r + 'px'); b.style.setProperty('--dy', (Math.sin(a)*r - 60) + 'px');
    b.style.setProperty('--r', (Math.random()*360-180) + 'deg');
    document.body.appendChild(b); setTimeout(() => b.remove(), 1200);
  }
}

/* ---------- views ---------- */
function authView(){
  const reg = mode === 'register';
  return '<div class="wrap"><div class="logo">💩</div><div class="tag">Какатрекер — кто главный обосранец?</div>' +
    '<div class="card"><div class="seg"><button data-mode="login" class="' + (!reg ? 'on' : '') + '">Вход</button>' +
    '<button data-mode="register" class="' + (reg ? 'on' : '') + '">Регистрация</button></div>' +
    '<form id="authform" autocomplete="on">' +
    '<div class="field"><label for="login">Логин</label><input id="login" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="например, vanya"></div>' +
    '<div class="field"><label for="pass">Пароль</label><input id="pass" type="password" name="password" autocomplete="' + (reg ? 'new-password' : 'current-password') + '" placeholder="минимум 6 символов"></div>' +
    (reg ? '<div class="field"><label for="dname">Имя в рейтинге</label><input id="dname" maxlength="24" placeholder="как тебя видят друзья"><div class="hint">Можно по-русски и с эмодзи. Потом можно поменять.</div></div>' : '') +
    '<button class="btn wide" type="submit"' + (authBusy ? ' disabled' : '') + '>' + (authBusy ? 'Секунду…' : reg ? 'Создать аккаунт' : 'Войти') + '</button>' +
    '<div class="err">' + esc(authErr) + '</div></form></div>' +
    '<div class="note">Почта не нужна — только логин и пароль.<br>Запомни пароль: восстановить его не получится.</div></div>';
}

function meView(){
  const d = myData(), s = calc(d && d.events);
  let hero;
  if (s.last == null) {
    hero = '<div class="label">Не какал уже</div><div class="empty">Ещё нет ни одной записи</div>' +
      '<div class="since">Нажми кнопку ниже, когда сходишь — и таймер пойдёт</div>';
  } else {
    const st = status(s.cur);
    hero = '<div class="label">Не какал уже</div><div class="timer">' +
      '<div class="unit"><div class="num" id="td">0</div><div class="cap" id="cd">дней</div></div><div class="sep">:</div>' +
      '<div class="unit"><div class="num" id="th">00</div><div class="cap">часов</div></div><div class="sep">:</div>' +
      '<div class="unit"><div class="num" id="tm">00</div><div class="cap">минут</div></div><div class="sep">:</div>' +
      '<div class="unit"><div class="num" id="ts">00</div><div class="cap">секунд</div></div></div>' +
      '<div class="status ' + st[0] + '" id="st">' + st[1] + '</div>' +
      '<div class="since">Последний раз: ' + esc(whenText(s.last)) + '</div>';
  }
  const legacy = legacyEvents();
  const banner = legacy.length ? '<div class="banner">📦 На этом устройстве есть ' + legacy.length + ' ' + plural(legacy.length,'запись','записи','записей') +
    ' из старой версии трекера. Перенести в аккаунт?<div class="row"><button class="btn" id="migrate">Перенести</button><button class="btn ghost" id="nomigrate">Не надо</button></div></div>' : '';

  const list = s.ev.slice().reverse(), shown = showAll ? list : list.slice(0, 15);
  let items = '';
  shown.forEach(t => {
    const idx = s.ev.indexOf(t), prev = idx > 0 ? s.ev[idx-1] : null;
    items += '<li><div><div class="when">💩 ' + esc(whenText(t)) + '</div>' +
      (prev != null ? '<div class="gap">через ' + esc(human(t-prev)) + ' после предыдущего</div>' : '<div class="gap">первая запись</div>') +
      '</div><button class="del' + (armed === t ? ' sure' : '') + '" data-del="' + t + '">' + (armed === t ? 'Удалить?' : '✕') + '</button></li>';
  });
  const nd = new Date(), nowLocal = nd.getFullYear()+'-'+pad(nd.getMonth()+1)+'-'+pad(nd.getDate())+'T'+pad(nd.getHours())+':'+pad(nd.getMinutes());

  return banner +
    '<div class="card hero">' + hero + '</div>' +
    '<button class="big" id="go"' + (loaded ? '' : ' disabled') + '>💩 Покакал!</button>' +
    '<div class="grid">' +
      '<div class="tile main"><div><div class="k">Всего покакал</div><div class="v">' + s.n + ' <small>' + plural(s.n,'раз','раза','раз') + '</small></div></div><div style="font-size:40px">🏆</div></div>' +
      '<div class="tile"><div class="v">' + s.today + '</div><div class="k">сегодня</div></div>' +
      '<div class="tile"><div class="v">' + s.week + '</div><div class="k">за 7 дней</div></div>' +
      '<div class="tile"><div class="v">' + (s.avg != null ? shortH(s.avg) + ' <small>' + shortUnit(s.avg) + '</small>' : '—') + '</div><div class="k">средний перерыв</div></div>' +
      '<div class="tile"><div class="v">' + (s.n ? shortH(s.record) + ' <small>' + shortUnit(s.record) + '</small>' : '—') + '</div><div class="k">рекорд без какания</div></div>' +
    '</div>' +
    '<details id="past"' + (pastOpen ? ' open' : '') + '><summary>🕐 Покакал раньше? Указать время</summary>' +
      '<div class="row"><input type="datetime-local" id="dt" value="' + nowLocal + '" max="' + nowLocal + '"><button class="btn" id="add">Добавить</button></div>' +
      '<div class="err" id="err"></div></details>' +
    (s.n ? '<div class="card"><h2>История</h2><ul class="hist">' + items + '</ul>' +
      (list.length > 15 ? '<div class="more"><button class="btn ghost" id="more">' + (showAll ? 'Свернуть' : 'Показать все (' + list.length + ')') + '</button></div>' : '') +
      '</div>' : '');
}

function topView(){
  const rows = Object.entries(users).map(([uid, u]) => ({ uid, name: nameOf(u), ...calc(u.events) }));
  if (!rows.length) return '<div class="center">Пока никого нет 🤷</div>';
  const cmp = {
    total: (a,b) => b.n - a.n || (b.last||0) - (a.last||0),
    week:  (a,b) => b.week - a.week || b.n - a.n,
    hold:  (a,b) => (a.last == null) - (b.last == null) || b.cur - a.cur
  }[sortBy];
  rows.sort(cmp);
  const lead = rows[0];
  const kingTitle = { total:'Главный обосранец', week:'Обосранец недели', hold:'Дольше всех терпит' }[sortBy];
  let kingSub;
  if (sortBy === 'total') kingSub = lead.n + ' ' + plural(lead.n,'раз','раза','раз') + ' за всё время';
  else if (sortBy === 'week') kingSub = lead.week + ' ' + plural(lead.week,'раз','раза','раз') + ' за 7 дней';
  else kingSub = lead.last != null ? 'не какает уже <span data-since="' + lead.last + '" data-fmt="human">' + human(lead.cur) + '</span>' : 'ещё ни разу не какал';
  const hasLead = sortBy === 'hold' ? lead.last != null : (sortBy === 'week' ? lead.week > 0 : lead.n > 0);

  let items = '';
  rows.forEach((r, i) => {
    const rank = i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1);
    let v, u;
    if (sortBy === 'total') { v = r.n; u = plural(r.n,'раз','раза','раз'); }
    else if (sortBy === 'week') { v = r.week; u = 'за неделю'; }
    else { v = r.last != null ? '<span data-since="' + r.last + '">' + compact(r.cur) + '</span>' : '—'; u = 'терпит'; }
    const sub = r.last != null ? 'последний раз <span data-since="' + r.last + '" data-fmt="human">' + human(r.cur) + '</span> назад' : 'ещё ни разу';
    items += '<li class="' + (me && r.uid === me.uid ? 'me' : '') + '"><div class="rank">' + rank + '</div>' +
      '<div class="pl"><div class="nm">' + esc(r.name) + (me && r.uid === me.uid ? '<i>это ты</i>' : '') + '</div><div class="sb">' + sub + '</div></div>' +
      '<div class="sc"><div class="v">' + v + '</div><div class="u">' + u + '</div></div></li>';
  });
  return '<div class="sorts">' +
      '<button data-sort="total" class="' + (sortBy === 'total' ? 'on' : '') + '">🏆 Всего</button>' +
      '<button data-sort="week" class="' + (sortBy === 'week' ? 'on' : '') + '">📅 Неделя</button>' +
      '<button data-sort="hold" class="' + (sortBy === 'hold' ? 'on' : '') + '">⏳ Терпит</button></div>' +
    (hasLead ? '<div class="card king"><div class="crown">' + (sortBy === 'hold' ? '🧘' : '👑') + '</div><div class="t">' + kingTitle + '</div>' +
      '<div class="n">' + esc(lead.name) + '</div><div class="s">' + kingSub + '</div></div>' : '') +
    '<div class="card" style="padding:8px"><ul class="board">' + items + '</ul></div>' +
    '<div class="note">' + rows.length + ' ' + plural(rows.length,'участник','участника','участников') + ' · обновляется само</div>';
}

function settingsView(){
  const d = myData();
  return '<div class="card"><h2>Имя в рейтинге</h2>' +
      '<div class="row" style="margin-top:0"><input id="newname" maxlength="24" value="' + esc(nameOf(d)) + '"><button class="btn" id="savename">Сохранить</button></div>' +
      '<div class="err" id="namemsg" style="color:var(--ok)">' + esc(nameMsg) + '</div></div>' +
    '<div class="card"><h2>Аккаунт</h2><div style="font-size:14px;color:var(--muted);margin-bottom:12px">Логин: <b style="color:var(--ink)">' + esc(me.login) + '</b></div>' +
      '<button class="btn ghost wide" id="logout">Выйти</button></div>' +
    '<div class="note">Чтобы позвать друзей — просто скинь им ссылку на этот сайт.<br>Они регистрируются и сразу появляются в рейтинге.</div>';
}

function render(){
  // keep typed values across re-renders (snapshots from friends arrive any time)
  const keep = {};
  app.querySelectorAll('input[id]').forEach(i => { keep[i.id] = i.value; });
  const focusId = document.activeElement && document.activeElement.id;

  if (!me) { app.innerHTML = authView(); }
  else {
    let body;
    if (fatal) body = '<div class="center">⚠️ ' + esc(fatal) + '</div>';
    else if (!loaded) body = '<div class="center">Загружаю данные… 💩</div>';
    else body = view === 'top' ? topView() : view === 'settings' ? settingsView() : meView();
    const d = myData();
    app.innerHTML = '<div class="wrap"><header><h1>💩 Какатрекер</h1><div class="who">' + esc(nameOf(d) || me.login) + '</div></header>' + body + '</div>' +
      '<nav class="tabs">' +
        '<button data-view="me" class="' + (view === 'me' ? 'on' : '') + '"><b>💩</b>Я</button>' +
        '<button data-view="top" class="' + (view === 'top' ? 'on' : '') + '"><b>🏆</b>Рейтинг</button>' +
        '<button data-view="settings" class="' + (view === 'settings' ? 'on' : '') + '"><b>⚙️</b>Настройки</button>' +
      '</nav>';
  }
  Object.keys(keep).forEach(id => { const el = document.getElementById(id); if (el && keep[id]) el.value = keep[id]; });
  if (focusId) { const f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
  tick();
}

function tick(){
  const now = Date.now();
  const d = myData(), s = d ? calc(d.events) : null;
  const el = id => document.getElementById(id);
  if (s && s.last != null && el('td')) {
    const p = split(s.cur);
    el('td').textContent = p.d; el('cd').textContent = plural(p.d,'день','дня','дней');
    el('th').textContent = pad(p.h); el('tm').textContent = pad(p.m); el('ts').textContent = pad(p.s);
    const st = status(s.cur), se = el('st');
    if (se && se.textContent !== st[1]) { se.className = 'status ' + st[0]; se.textContent = st[1]; }
  }
  document.querySelectorAll('[data-since]').forEach(n => {
    const ms = now - Number(n.dataset.since);
    n.textContent = n.dataset.fmt === 'human' ? human(ms) : compact(ms);
  });
}
setInterval(tick, 1000);

/* ---------- events ---------- */
app.addEventListener('toggle', e => { if (e.target.id === 'past') pastOpen = e.target.open; }, true);
app.addEventListener('submit', e => { if (e.target.id === 'authform') { e.preventDefault(); doAuth(); } });
app.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) { if (armed) { armed = null; render(); } return; }
  if (t.dataset.mode) { mode = t.dataset.mode; authErr = ''; render(); return; }
  if (t.dataset.view) { view = t.dataset.view; armed = null; nameMsg = ''; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.sort) { sortBy = t.dataset.sort; render(); return; }
  if (t.id === 'go') {
    const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2);
    addPoop(Date.now()); armed = null; showToast('Записано! 💩'); return;
  }
  if (t.id === 'add') {
    const v = document.getElementById('dt').value, err = document.getElementById('err');
    let ts = v ? new Date(v).getTime() : NaN;
    if (isNaN(ts)) { err.textContent = 'Выбери дату и время'; return; }
    if (ts > Date.now() + 60000) { err.textContent = 'Из будущего какать нельзя 🙂'; return; }
    const have = new Set(clean(myData() && myData().events));
    while (have.has(ts)) ts += 1;
    addPoop(ts); pastOpen = false; showToast('Добавлено задним числом 🕐'); return;
  }
  if (t.id === 'more') { showAll = !showAll; render(); return; }
  if (t.dataset.del) {
    const id = Number(t.dataset.del);
    if (armed === id) { armed = null; removePoop(id); }
    else { armed = id; render(); }
    return;
  }
  if (t.id === 'migrate') {
    const ev = legacyEvents();
    if (ev.length) fs.setDoc(myDoc(), { events: fs.arrayUnion(...ev), login: me.login }, { merge: true })
      .then(() => { lsSet(MIGRATED_LS, '1'); showToast('Перенесено: ' + ev.length); render(); })
      .catch(err => showToast(authError(err)));
    return;
  }
  if (t.id === 'nomigrate') { lsSet(MIGRATED_LS, '1'); render(); return; }
  if (t.id === 'savename') {
    const nm = (document.getElementById('newname').value || '').trim().slice(0, 24);
    if (!nm) return;
    fs.setDoc(myDoc(), { name: nm }, { merge: true }).then(() => { nameMsg = 'Сохранено ✓'; render(); }).catch(err => showToast(authError(err)));
    return;
  }
  if (t.id === 'logout') { view = 'me'; mode = 'login'; authErr = ''; fa.signOut(fa.auth); return; }
});

render();
</script>
</body>
</html>
