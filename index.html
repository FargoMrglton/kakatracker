<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калометр</title>
<meta name="theme-color" content="#7A4B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="description" content="Калометр — измеряем, кто главный обосранец. Трекер, рейтинг, ачивки и Туалетная газета.">
<meta property="og:title" content="Калометр 💩">
<meta property="og:description" content="Измеряем, кто главный обосранец: секундомер на троне, засранные серии, ачивки и рейтинг друзей.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=PT+Serif:wght@700&display=swap">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#3B2414; --muted:#8A6F5A; --line:#F0E2CF;
  --brown:#7A4B26; --brown2:#A0662F; --accent:#E8A23A; --ok:#4E9A5B; --warn:#D9822B; --bad:#C2453A;
  --bar:#A0662F; --me:rgba(232,162,58,.16); --paper:#FBF3E4; --shadow:0 6px 24px rgba(122,75,38,.10);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1C140E; --card:#271C14; --ink:#F6E9DA; --muted:#B39A84; --line:#3A2B1F;
    --brown:#E0A86A; --brown2:#C98A4B; --accent:#F0B550; --bar:#BF8040; --me:rgba(240,181,80,.14); --paper:#2C2018; --shadow:0 6px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:10px}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.2px;white-space:nowrap}
.hr{display:flex;align-items:center;gap:10px;min-width:0}
.tg{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--me);color:var(--brown);border:1px solid var(--line);text-decoration:none}
.tg:active{transform:scale(.94)}
.tgpill{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;padding:11px 16px;border-radius:999px;background:var(--me);border:1px solid var(--line);color:var(--brown);font-size:14.5px;font-weight:500;text-decoration:none;max-width:360px}
.tgpill svg{flex:none}
.who{font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.hero{text-align:center;padding:24px 16px 20px}
.label{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:500}
.timer{display:flex;justify-content:center;gap:8px;margin:14px 0 10px}
.unit{min-width:64px}
.num{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--brown)}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.sep{font-size:38px;font-weight:700;color:var(--line);line-height:1.05}
.status{display:inline-block;margin-top:6px;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:500;background:var(--line)}
.status.ok{background:rgba(78,154,91,.14);color:var(--ok)}
.status.warn{background:rgba(217,130,43,.15);color:var(--warn)}
.status.bad{background:rgba(194,69,58,.14);color:var(--bad)}
.since{font-size:13px;color:var(--muted);margin-top:10px}
.empty{font-size:18px;margin:18px 0 6px;color:var(--muted)}
.big{display:block;width:100%;border:0;border-radius:20px;padding:20px;font:inherit;font-size:22px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#B9773A,#7A4B26);box-shadow:0 8px 0 #5A3519,0 12px 24px rgba(90,53,25,.3);transition:transform .08s,box-shadow .08s;margin:4px 0 12px}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 #5A3519,0 6px 12px rgba(90,53,25,.3)}
.big:disabled{opacity:.6}
.big.cool{filter:grayscale(.55);opacity:.8}
.big.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:26px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}
.tile .k{font-size:12.5px;color:var(--muted);margin-top:2px}
.tile.wide{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile.main .v{font-size:38px}
.tile .side{font-size:40px;flex:none}
.tile .hint{font-size:12.5px;color:var(--warn);margin-top:4px}
details{margin-bottom:14px}
summary{cursor:pointer;color:var(--brown2);font-size:14px;font-weight:500;list-style:none;padding:4px 2px}
summary::-webkit-details-marker{display:none}
.row{display:flex;gap:8px;margin-top:10px}
input{flex:1;min-width:0;width:100%;font:inherit;font-size:16px;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:12px;padding:12px 16px;background:var(--brown);color:#fff;cursor:pointer}
.btn.wide{width:100%;font-size:17px;padding:14px}
.btn.ghost{background:transparent;color:var(--brown2);border:1px solid var(--line)}
.btn.okb{background:var(--ok)}
.btn:disabled{opacity:.6}
.throne-btn{width:100%;margin-bottom:16px}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:1px;line-height:1.4}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.when{font-size:15px}
.gap{font-size:12.5px;color:var(--muted);margin-top:2px}
.del{flex:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.del.sure{background:rgba(194,69,58,.12);color:var(--bad);font-weight:500}
.more{text-align:center;margin-top:8px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.5}
.banner{background:var(--me);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px;line-height:1.4}
.banner.bad{background:rgba(194,69,58,.10);color:var(--bad)}
.banner .row{margin-top:10px}
.link{border:0;background:none;color:var(--brown2);font:inherit;font-size:14px;font-weight:500;padding:4px 0;cursor:pointer}
/* throne */
.throne .clock{font-size:56px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums;margin:12px 0 4px;line-height:1}
.throne .sub{font-size:13px;color:var(--muted)}
.throne .warnbox{margin-top:14px;padding:12px;border-radius:14px;background:rgba(217,130,43,.13);color:var(--warn);font-size:14px;line-height:1.4;text-align:left}
.throne .col{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mins{display:flex;gap:8px;align-items:center;margin-top:10px}
.mins input{max-width:110px;text-align:center}
.live{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--me);border:1px solid var(--line);margin-bottom:14px;font-size:14.5px}
.live .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;max-width:130px;border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--muted);padding:6px 2px;border-radius:12px;cursor:pointer}
.tabs button b{display:block;font-size:21px;line-height:1.2}
.tabs button.on{color:var(--brown);font-weight:700;background:var(--me)}
/* auth */
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:15px;padding:10px;border-radius:10px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 2px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px;line-height:1.35;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--brown);padding:0}
.hint2{font-size:12px;color:var(--muted);margin:5px 0 0 2px}
.logo{text-align:center;font-size:64px;margin:18px 0 4px}
.logoimg{display:block;width:200px;height:200px;margin:6px auto 4px;object-fit:contain}
h1 img{width:30px;height:30px;vertical-align:-8px;margin-right:6px}
.tag{text-align:center;color:var(--muted);margin:0 0 20px;font-size:15px}
/* leaderboard */
.sorts{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sorts button{flex:none;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;color:var(--ink);cursor:pointer}
.sorts button.on{background:var(--brown);border-color:var(--brown);color:#fff;font-weight:500}
.king{text-align:center;padding:20px 16px}
.king .crown{font-size:44px}
.king .t{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;margin-top:4px}
.king .n{font-size:26px;font-weight:800;margin:4px 0 2px;word-break:break-word}
.king .s{font-size:14px;color:var(--muted)}
.board li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px;cursor:pointer}
.board li + li{border-top:1px solid var(--line)}
.board li.me{background:var(--me);border-top-color:transparent}
.board li.me + li{border-top-color:transparent}
.rank{flex:none;width:34px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
.pl{flex:1;min-width:0}
.pl .nm{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .nm i{font-style:normal;font-size:12px;color:var(--brown2);font-weight:500;margin-left:4px}
.pl .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.sc{flex:none;text-align:right}
.sc .v{font-size:22px;font-weight:800;color:var(--brown);font-variant-numeric:tabular-nums}
.sc .u{font-size:11.5px;color:var(--muted)}
/* newspaper */
.mast{background:var(--paper);text-align:center;padding:16px 16px 14px;border-radius:22px;border:1px solid var(--line);margin-bottom:14px;box-shadow:var(--shadow)}
.mast .title{font-family:'PT Serif',Georgia,'Times New Roman',serif;font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1.05}
.mast .issue{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin:8px 0 10px;padding:6px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.mastlink{display:inline-block;margin-top:10px;font-size:13px;color:var(--brown2);text-decoration:none;font-weight:500}
.mast .head{font-family:'PT Serif',Georgia,serif;font-size:19px;font-weight:700;line-height:1.3}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.post .top{display:flex;gap:10px;align-items:flex-start}
.post .ic{flex:none;font-size:26px;line-height:1.1}
.post .tx{flex:1;min-width:0;font-size:15px;line-height:1.4}
.post .tx b{font-weight:700;cursor:pointer}
.post .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.post.ach{background:var(--me)}
.reacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reacts button{border:1px solid var(--line);background:var(--bg);font:inherit;font-size:14px;padding:5px 9px;border-radius:999px;cursor:pointer;color:var(--ink)}
.reacts button.mine{border-color:var(--brown2);background:var(--me);font-weight:700}
.reacts button:disabled{cursor:default}
.reacts button span{font-size:12.5px;margin-left:3px;font-variant-numeric:tabular-nums}
.who-r{font-size:12px;color:var(--muted);margin-top:6px}
/* profile */
.prof{text-align:center;padding:22px 16px 18px}
.prof .av{font-size:54px}
.prof .nm{font-size:24px;font-weight:800;margin-top:4px;word-break:break-word}
.prof .lg{font-size:13px;color:var(--muted)}
.prof .chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:13.5px;padding:6px 11px;border-radius:999px;background:var(--me);font-weight:500}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach-i{border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;background:var(--bg)}
.ach-i .e{font-size:28px}
.ach-i .n{font-size:12.5px;font-weight:700;margin-top:4px;line-height:1.2}
.ach-i .d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.25}
.ach-i.off{opacity:.45}
.ach-i.off .e{filter:grayscale(1)}
/* charts */
.ch-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.ch-h h2{margin:0}
.ch-cap{font-size:13px;color:var(--muted);min-height:18px;margin-bottom:8px}
.ch-cap b{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.bar span{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0}
.bar.sel span{background:var(--ink)}
.ticks{position:relative;height:18px;font-size:11px;color:var(--muted)}
.ticks span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:14px;z-index:8;animation:tin .25s ease-out;max-width:calc(100% - 32px);text-align:center}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.burst{position:fixed;pointer-events:none;font-size:30px;z-index:9;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--r))}}
.center{text-align:center;color:var(--muted);padding:60px 10px;line-height:1.5}
.setup ol{padding-left:20px;line-height:1.55;font-size:14.5px}
code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:13px}
@media (max-width:380px){.num{font-size:36px}.unit{min-width:52px}.sep{font-size:30px}.achs{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const TG_URL = 'https://t.me/kalometr_vibecode'; // ссылка на Telegram-канал, например https://t.me/kalometr
const PLANE = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21.5 3.5 2.8 10.8c-.7.3-.7 1.3.1 1.5l4.6 1.4 1.8 5.6c.2.7 1.1.9 1.6.3l2.6-2.7 4.6 3.4c.6.4 1.4.1 1.6-.6l3-14.9c.1-.8-.6-1.4-1.3-1.1Z"/><path d="m7.5 13.7 9.5-6.2-6.9 7.4"/></svg>';

const tgPill = (txt) => TG_URL ? '<a class="tgpill" href="' + TG_URL + '" target="_blank" rel="noopener">' + PLANE + '<span>' + txt + '</span></a>' : '';
const LOGIN_DOMAIN = '@kakatracker.app';
const LEGACY_LS = 'kakatracker-state';
const MIGRATED_LS = 'kakatracker-migrated';
const COOLDOWN_MS = 15000;
const EMOJIS = ['👏', '😂', '🤢', '🔥', '💩'];
const H = 3600000, DAY = 86400000;
const SESSION_MAX = 60 * 60000; // дольше часа — секундомер сбрасывается, засчитываем 1 раз без времени

const app = document.getElementById('app');

/* ---------- helpers ---------- */
function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10;
  if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
const pad = n => (n < 10 ? '0' : '') + n;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = arr => (Array.isArray(arr) ? arr : []).map(Number).filter(t => isFinite(t) && t > 0);
function split(ms){ const s = Math.max(0, Math.floor(ms/1000));
  return { d: Math.floor(s/86400), h: Math.floor(s%86400/3600), m: Math.floor(s%3600/60), s: s%60 }; }
function human(ms){ const p = split(ms);
  if (p.d > 0) return p.d + ' ' + plural(p.d,'день','дня','дней') + (p.h ? ' ' + p.h + ' ч' : '');
  if (p.h > 0) return p.h + ' ч' + (p.m ? ' ' + p.m + ' мин' : '');
  if (p.m > 0) return p.m + ' мин';
  return 'меньше минуты'; }
function compact(ms){ const p = split(ms);
  if (p.d > 0) return p.d + 'д ' + p.h + 'ч';
  if (p.h > 0) return p.h + 'ч ' + pad(p.m) + 'м';
  return p.m + 'м ' + pad(p.s) + 'с'; }
function clock(ms){ const p = split(ms), h = p.d*24 + p.h; return (h ? h + ':' + pad(p.m) : p.m) + ':' + pad(p.s); }
function durText(sec){ sec = Math.round(sec);
  if (sec < 60) return sec + ' с';
  if (sec < 3600) { const m = Math.floor(sec/60), s = sec % 60; return m + ' мин' + (s ? ' ' + s + ' с' : ''); }
  const h = Math.floor(sec/3600), m = Math.round(sec%3600/60); return h + ' ч' + (m ? ' ' + m + ' мин' : ''); }
function shortH(ms){ const h = ms/H; if (h >= 48) return (h/24).toFixed(1).replace('.', ','); return h >= 10 ? Math.round(h) : h.toFixed(1).replace('.', ','); }
const shortUnit = ms => ms/H >= 48 ? 'дн' : 'ч';
const fmtDay = new Intl.DateTimeFormat('ru-RU', { weekday:'short', day:'numeric', month:'long' });
const fmtDate = new Intl.DateTimeFormat('ru-RU', { day:'numeric', month:'long' });
const fmtTime = new Intl.DateTimeFormat('ru-RU', { hour:'2-digit', minute:'2-digit' });
const dayNum = t => { const d = new Date(t); return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / DAY); };
function whenText(t){
  const today = dayNum(Date.now()), k = dayNum(t);
  const day = k === today ? 'Сегодня' : k === today - 1 ? 'Вчера' : fmtDay.format(new Date(t));
  return day.charAt(0).toUpperCase() + day.slice(1) + ', ' + fmtTime.format(new Date(t));
}
function status(ms){
  const h = ms/H;
  if (h < 8)  return ['ok',  'Свежак. Всё под контролем ✨'];
  if (h < 24) return ['ok',  'Штатный режим 👌'];
  if (h < 36) return ['warn','Организм думает 🤔'];
  if (h < 48) return ['warn','Пора бы уже… 🫠'];
  if (h < 72) return ['bad', 'Тревожно 😬 Вода, клетчатка, движение'];
  return ['bad','Больше 3 дней — стоит спросить врача 🩺'];
}
function errText(e){
  const c = (e && e.code) || '';
  if (c.includes('email-already-in-use')) return 'Такой логин уже занят — выбери другой или войди.';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'Неверный логин или пароль.';
  if (c.includes('weak-password')) return 'Пароль слишком простой — минимум 6 символов.';
  if (c.includes('too-many-requests')) return 'Слишком много попыток. Подожди пару минут.';
  if (c.includes('network-request-failed') || c.includes('unavailable')) return 'Нет связи с сервером. Проверь интернет (в России может понадобиться VPN).';
  if (c.includes('operation-not-allowed') || c.includes('configuration-not-found')) return 'В Firebase не включён вход по Email/паролю (Authentication → Sign-in method).';
  if (c.includes('permission-denied')) return 'Сервер не пустил. Владельцу сайта нужно обновить правила Firestore.';
  if (c.includes('invalid-api-key') || c.includes('api-key-not-valid')) return 'Неверный apiKey в настройках сайта.';
  return 'Ошибка: ' + (c || (e && e.message) || 'неизвестно');
}

];
const ACH_BY_ID = Object.fromEntries(ACH.map(a => [a.id, a]));

function nearest(sorted, t){ // nearest value in sorted array
  let lo = 0, hi = sorted.length - 1, best = null;
  while (lo <= hi) { const mid = (lo + hi) >> 1, v = sorted[mid];
    if (best == null || Math.abs(v - t) < Math.abs(best - t)) best = v;
    if (v < t) lo = mid + 1; else if (v > t) hi = mid - 1; else return v; }
  return best;
}
function computeAch(ev, durs, others, given, got){
  const at = {};
  if (ev.length >= 1) at.first = ev[0];
  if (ev.length >= 10) at.n10 = ev[9];
  if (ev.length >= 50) at.n50 = ev[49];
  if (ev.length >= 100) at.n100 = ev[99];
  const perDay = {};
  let run = 0, prevDay = null;
  for (let i = 0; i < ev.length; i++) {
    const t = ev[i], hr = new Date(t).getHours(), d = dayNum(t);
    if (at.early == null && hr >= 4 && hr < 7) at.early = t;
    if (at.night == null && hr < 4) at.night = t;
    perDay[d] = (perDay[d] || 0) + 1;
    if (at.hattrick == null && perDay[d] === 3) at.hattrick = t;
    if (at.iron == null && i > 0 && t - ev[i-1] >= 48 * H) at.iron = t;
    if (d !== prevDay) { run = (prevDay != null && d === prevDay + 1) ? run + 1 : 1; prevDay = d; }
    if (at.streak7 == null && run >= 7) at.streak7 = t;
    if (at.streak30 == null && run >= 30) at.streak30 = t;
    if (others.length) {
      const o = nearest(others, t);
      if (o != null && Math.abs(o - t) <= 5 * 60000) { const u = Math.max(o, t); if (at.sync == null || u < at.sync) at.sync = u; }
    }
  }
  durs.forEach(([t, s]) => {
    if (at.reader == null && s >= 1200) at.reader = t;
    if (at.sprinter == null && s > 0 && s <= 60) at.sprinter = t;
  });
  if (given.length >= 10) at.critic = given[9];
  if (got.length >= 10) at.star = got[9];
  return at;
}
function streakInfo(ev){
  const days = [...new Set(ev.map(dayNum))].sort((a, b) => a - b), set = new Set(days);
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = (prev != null && d === prev + 1) ? run + 1 : 1; best = Math.max(best, run); prev = d; });
  const today = dayNum(Date.now());
  let d = set.has(today) ? today : set.has(today - 1) ? today - 1 : null, cur = 0;
  if (d != null) while (set.has(d)) { cur++; d--; }
  return { cur, best, todayDone: set.has(today) };
}

let loaded = false, unsubs = [], profileEnsured = false, pendingName = '', rulesOld = false;

const myDoc = () => fs.doc(fs.db, 'users', me.uid);
const myData = () => (me && users[me.uid]) || null;
const nameOf = u => (u && (u.name || u.login)) || 'Аноним';
const normName = n => String(n || '').trim().replace(/\s+/g, ' ').slice(0, 24);
const nameKey = n => normName(n).toLowerCase();
function nameProblem(n){
  if (n.length < 2) return 'Имя — минимум 2 символа.';
  if (n.includes('/') || /^\.+$/.test(n) || /^__.*__$/.test(n)) return 'В имени нельзя использовать «/» и служебные сочетания.';

}
// имя занято кем-то другим среди участников (без учёта регистра)
const nameTakenLocally = n => Object.entries(users).some(([id, u]) => id !== (me && me.uid) && nameKey(nameOf(u)) === nameKey(n));
const isPerm = e => ((e && e.code) || '').includes('permission-denied');
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
// Сохранить имя и «застолбить» его в коллекции names (одной пачкой)
async function claimName(name, extra){
  const newRef = fs.doc(fs.db, 'names', name);
  const cur = await fs.getDoc(newRef);
  if (cur.exists() && cur.data().uid !== me.uid) { const e = new Error('taken'); e.taken = true; throw e; }
  const b = fs.writeBatch(fs.db);
  b.set(myDoc(), { ...(extra || {}), name }, { merge: true });
  if (!cur.exists()) b.set(newRef, { uid: me.uid });
  const old = myData() && myData().name;
  if (old && old !== name) {
    const oldRef = fs.doc(fs.db, 'names', old), o = await fs.getDoc(oldRef).catch(() => null);
    if (o && o.exists() && o.data().uid === me.uid) b.delete(oldRef);
  }
  await b.commit();
}
const onWriteErr = e => { if ((e && e.code || '').includes('permission-denied')) rulesOld = true; showToast(errText(e)); render(); };
const activeSession = u => (u && u.session && Number(u.session.start) > 0) ? Number(u.session.start) : null;

/* ---------- model ---------- */
function buildModel(){
  const now = Date.now(), per = {};
  const evBy = {};
  Object.entries(users).forEach(([uid, u]) => { evBy[uid] = clean(u.events).sort((a, b) => a - b); });
  const reactList = Object.values(reactions).filter(r => r && r.owner && r.by && EMOJIS.includes(r.emoji));
  const byEvent = {};
  reactList.forEach(r => { const k = r.owner + '_' + r.ts; (byEvent[k] = byEvent[k] || []).push(r); });
  Object.entries(users).forEach(([uid, u]) => {
    const ev = evBy[uid], evSet = new Set(ev), n = ev.length;
    const last = n ? ev[n-1] : null, gaps = [];
    for (let i = 1; i < n; i++) gaps.push(ev[i] - ev[i-1]);
    const cur = last != null ? Math.max(0, now - last) : 0;
    const durMap = (u.durations && typeof u.durations === 'object') ? u.durations : {};
    const durs = Object.entries(durMap).map(([k, v]) => [Number(k), Number(v)])
      .filter(([k, v]) => evSet.has(k) && isFinite(v) && v > 0 && v <= SESSION_MAX / 1000).sort((a, b) => a[0] - b[0]);
    const others = Object.entries(evBy).filter(([id]) => id !== uid).flatMap(([, e]) => e).sort((a, b) => a - b);
    const given = reactList.filter(r => r.by === uid).map(r => Number(r.at) || 0).sort((a, b) => a - b);
    const got = reactList.filter(r => r.owner === uid && r.by !== uid && evSet.has(Number(r.ts))).map(r => Number(r.at) || 0).sort((a, b) => a - b);
    const achAt = computeAch(ev, durs, others, given, got);
    per[uid] = {
      uid, u, name: nameOf(u), ev, n, last, cur,
      record: Math.max(0, cur, ...gaps),
      avg: gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : null,
      today: ev.filter(t => dayNum(t) === dayNum(now)).length,
      week: ev.filter(t => t >= now - 7 * DAY).length,
      streak: streakInfo(ev),
      durMap: Object.fromEntries(durs), durs,
      achAt, achCount: Object.keys(achAt).length,
      session: (() => { const st = activeSession(u); return st && now - st < SESSION_MAX ? st : null; })(),
      gotCount: got.length
    };
  });
  return { per, byEvent, now };
}

/* ---------- auth ---------- */
fa.onAuthStateChanged(fa.auth, user => {
  unsubs.forEach(f => f()); unsubs = [];
  users = {}; reactions = {}; loaded = false; profileEnsured = false; fatal = ''; armed = null; rulesOld = false;
  priv = null; privLoaded = false; nameConflict = false; claimChecked = false;
  if (!user) { me = null; render(); return; }
  const created = Date.parse((user.metadata && user.metadata.creationTime) || '');
  me = { uid: user.uid, login: (user.email || '').replace(LOGIN_DOMAIN, ''), createdAt: isFinite(created) ? created : null };
  unsubs.push(fs.onSnapshot(fs.collection(fs.db, 'users'), snap => {
    const next = {}; snap.forEach(d => { next[d.id] = d.data(); });
    users = next; loaded = true;
    if (!snap.metadata.fromCache) {
      if (!users[me.uid] && !profileEnsured) ensureProfile();
      else if (users[me.uid] && !claimChecked) checkClaim();
    }
    render();
  }, err => { fatal = errText(err); render(); }));
  unsubs.push(fs.onSnapshot(fs.doc(fs.db, 'private', me.uid), snap => {
    priv = snap.exists() ? snap.data() : null; privLoaded = true; render();
  }, err => { privLoaded = true; if (isPerm(err)) { rulesOld = true; render(); } }));
  unsubs.push(fs.onSnapshot(fs.collection(fs.db, 'reactions'), snap => {
    const next = {}; snap.forEach(d => { next[d.id] = d.data(); });
    reactions = next; render();
  }, err => { if ((err.code || '').includes('permission-denied')) { rulesOld = true; render(); } }));
  render();
});

async function ensureProfile(){
  profileEnsured = true; claimChecked = true;
  let name = normName(pendingName || me.login);
  if (nameProblem(name) || nameTakenLocally(name)) {
    if (pendingName) showToast('Имя «' + name + '» уже занято — пока будешь «' + me.login + '». Поменяй в профиле 👤');
    name = me.login;
  }
  const prof = { login: me.login, createdAt: Date.now() };
  try { await claimName(name, prof); }
  catch (e) {
    if (e.taken) { await claimName(me.login, prof).catch(() => fs.setDoc(myDoc(), { ...prof, name: me.login }, { merge: true })); showToast('Имя «' + name + '» уже занято — поменяй в профиле 👤'); }
    else if (isPerm(e)) { rulesOld = true; await fs.setDoc(myDoc(), { ...prof, name }, { merge: true }).catch(onWriteErr); }
    else onWriteErr(e);
  }
  if (pendingEmail) { savePrivate(pendingEmail); pendingEmail = ''; }
  render();
}
// Для старых участников: «застолбить» текущее имя, если его ещё никто не занял
async function checkClaim(){
  claimChecked = true;
  const d = myData(), name = d && d.name;
  if (!name || nameProblem(name)) return;
  try {
    const cur = await fs.getDoc(fs.doc(fs.db, 'names', name));
    if (cur.exists()) { nameConflict = cur.data().uid !== me.uid; if (nameConflict) render(); return; }
    if (nameTakenLocally(name)) { nameConflict = true; render(); return; }
    await claimName(name);
  } catch (e) { if (isPerm(e)) { rulesOld = true; render(); } }
}
function savePrivate(email){
  return fs.setDoc(fs.doc(fs.db, 'private', me.uid), { email, consent: true, consentAt: Date.now() })
    .then(() => { emailMsg = 'Сохранено ✓'; render(); }).catch(onWriteErr);
}

async function doAuth(){
  const login = (document.getElementById('login').value || '').trim().toLowerCase();
  const pass = document.getElementById('pass').value || '';
  const nameEl = document.getElementById('dname');
  const name = nameEl ? nameEl.value.trim() : '';
  if (!/^[a-z0-9_.-]{3,20}$/.test(login)) { authErr = 'Логин: 3–20 символов, латиница, цифры, точка, _ или -'; render(); return; }
  if (pass.length < 6) { authErr = 'Пароль — минимум 6 символов.'; render(); return; }
  const nm = normName(name);
  let email = '';
  if (mode === 'register') {
    if (!nm) { authErr = 'Придумай имя для рейтинга.'; render(); return; }
    const np = nameProblem(nm); if (np) { authErr = np; render(); return; }
    email = (document.getElementById('email').value || '').trim().toLowerCase();
    const consent = document.getElementById('consent').checked;
    if (email && !EMAIL_RE.test(email)) { authErr = 'Почта выглядит неправильно. Можно оставить пустой.'; render(); return; }
    if (email && !consent) { authErr = 'Отметь согласие на письма о розыгрышах — или оставь почту пустой.'; render(); return; }
  }
  authBusy = true; authErr = ''; render();
  try {
    if (mode === 'register') {
      try { const n = await fs.getDoc(fs.doc(fs.db, 'names', nm)); if (n.exists()) { authErr = 'Имя «' + nm + '» уже занято — придумай другое.'; authBusy = false; render(); return; } } catch (e) {}
      pendingName = nm; pendingEmail = email;
      await fa.createUserWithEmailAndPassword(fa.auth, login + LOGIN_DOMAIN, pass);
    }
    else await fa.signInWithEmailAndPassword(fa.auth, login + LOGIN_DOMAIN, pass);
  } catch (e) { authErr = errText(e); }
  authBusy = false; render();
}

/* ---------- writes ---------- */
const merge = data => fs.setDoc(myDoc(), data, { merge: true }).catch(onWriteErr);
function addPoop(ts, durSec){
  const data = { events: fs.arrayUnion(ts), login: me.login };
  if (durSec) data.durations = { [String(ts)]: Math.round(durSec) };
  return merge(data);
}
function removePoop(ts){ return merge({ events: fs.arrayRemove(ts), durations: { [String(ts)]: fs.deleteField() } }); }
function startSession(){ return merge({ session: { start: Date.now() } }); }
function finishSession(start, durSec){
  return merge({ events: fs.arrayUnion(start), durations: { [String(start)]: Math.max(1, Math.round(durSec)) }, session: fs.deleteField(), login: me.login });
}
function cancelSession(){ return merge({ session: fs.deleteField() }); }
let autoClosing = false;
// Сидел дольше часа: засчитываем 1 раз, время на троне не пишем
function autoCloseSession(start){
  if (autoClosing) return; autoClosing = true;
  merge({ events: fs.arrayUnion(start), session: fs.deleteField(), login: me.login })
    .then(() => showToast('Секундомер шёл больше 60 минут — засчитали 1 раз, время на троне не учли 🚽'))
    .finally(() => { autoClosing = false; });
}
function toggleReaction(owner, ts, emoji){
  const id = owner + '_' + ts + '_' + me.uid, cur = reactions[id], ref = fs.doc(fs.db, 'reactions', id);
  if (cur && cur.emoji === emoji) fs.deleteDoc(ref).catch(onWriteErr);
  else fs.setDoc(ref, { owner, ts: Number(ts), by: me.uid, emoji, at: Date.now() }).catch(onWriteErr);
}
function legacyEvents(){
  if (lsGet(MIGRATED_LS)) return [];
  try { const s = JSON.parse(lsGet(LEGACY_LS) || 'null'); return s ? clean(s.events) : []; } catch(e) { return []; }
}
// Дата регистрации: из Firebase Auth, запасной вариант — из профиля
function regAt(){
  const d = myData(), a = me && me.createdAt, b = d && Number(d.createdAt);
  const vals = [a, b].filter(x => isFinite(x) && x > 0);
  return vals.length ? Math.min(...vals) : null;
}
const toLocalInput = t => { const d = new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
function cooldownLeft(){
  const d = myData(), mine = clean(d && d.events), now = Date.now();
  const recent = Math.max(lastTapAt, ...mine.filter(x => x <= now + 60000), 0);
  return Math.max(0, Math.ceil((COOLDOWN_MS - (now - recent)) / 1000));
}

/* ---------- toast & burst ---------- */
let toastTimer = null;
function showToast(msg){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2800);
}
function burst(x, y){
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('div'); b.className = 'burst'; b.textContent = i % 3 ? '💩' : '✨';
    const a = Math.random()*Math.PI*2, r = 80 + Math.random()*90;
    b.style.left = (x-15) + 'px'; b.style.top = (y-15) + 'px';
    b.style.setProperty('--dx', Math.cos(a)*r + 'px'); b.style.setProperty('--dy', (Math.sin(a)*r - 60) + 'px');
    b.style.setProperty('--r', (Math.random()*360-180) + 'deg');
    document.body.appendChild(b); setTimeout(() => b.remove(), 1200);
  }
}

function liveBox(){
  const on = Object.values(M.per).filter(p => p.session);
  if (!on.length) return '';
  return on.map(p => '<div class="live"><span class="dot"></span><div>🚽 <b data-profile="' + p.uid + '" style="cursor:pointer">' + esc(p.name) + '</b>' +
    (p.uid === me.uid ? ' (это ты)' : '') + ' прямо сейчас на троне · <span data-clock="' + p.session + '">' + clock(M.now - p.session) + '</span></div></div>').join('');
}

function headline(){
  const ps = Object.values(M.per), now = M.now;
  const live = ps.filter(p => p.session).sort((a, b) => a.session - b.session)[0];
  if (live) return 'ПРЯМОЙ ЭФИР: ' + live.name + ' прямо сейчас на троне!';
  const most = ps.slice().sort((a, b) => b.today - a.today)[0];
  if (most && most.today >= 3) return 'Сенсация! ' + most.name + ' сходил уже ' + most.today + ' ' + plural(most.today,'раз','раза','раз') + ' за день';
  const longSess = ps.flatMap(p => p.durs.filter(([t]) => dayNum(t) === dayNum(now)).map(([t, s]) => ({ p, s }))).sort((a, b) => b.s - a.s)[0];
  if (longSess && longSess.s >= 600) return 'Рекорд заседания: ' + longSess.p.name + ' провёл на троне ' + durText(longSess.s);
  const worried = ps.filter(p => p.last != null).sort((a, b) => b.cur - a.cur)[0];
  if (worried && worried.cur >= 36 * H) return 'Редакция обеспокоена: ' + worried.name + ' не какает уже ' + human(worried.cur);
  const streaky = ps.slice().sort((a, b) => b.streak.cur - a.streak.cur)[0];
  if (streaky && streaky.streak.cur >= 3) return streaky.name + ' держит засранную серию ' + streaky.streak.cur + ' ' + plural(streaky.streak.cur,'день','дня','дней') + ' подряд 🔥';
  const latest = ps.filter(p => p.last != null).sort((a, b) => b.last - a.last)[0];
  if (latest) return 'Последние новости: ' + latest.name + ' сходил ' + human(now - latest.last) + ' назад';
  return 'Новостей нет. Редакция ждёт первого героя';
}

function feedView(){
  const now = M.now, from = now - 30 * DAY, items = [];
  Object.values(M.per).forEach(p => {
    p.ev.forEach(t => { if (t >= from) items.push({ type: 'poop', p, t }); });
    Object.entries(p.achAt).forEach(([id, t]) => { if (t >= from) items.push({ type: 'ach', p, t, a: ACH_BY_ID[id] }); });
  });
  items.sort((a, b) => b.t - a.t || (a.type === 'ach') - (b.type === 'ach'));
  const readers = Object.keys(M.per).length;
  let html = '<div class="mast"><div class="title">🧻 Туалетная газета</div>' +
    '<div class="issue">Выпуск от ' + fmtDate.format(new Date(now)) + ' · ' + readers + ' ' + plural(readers,'читатель','читателя','читателей') + '</div>' +
    '<div class="head">' + esc(headline()) + '</div>' +
    (TG_URL ? '<a class="mastlink" href="' + TG_URL + '" target="_blank" rel="noopener">📣 Новости самого Калометра — в Telegram</a>' : '') + '</div>' + liveBox();
  if (!items.length) return html + '<div class="center" style="padding:30px 10px">За последний месяц новостей нет 🤷</div>';
  items.slice(0, feedLimit).forEach(it => {
    const p = it.p, isMe = p.uid === me.uid, ago = human(now - it.t);
    const nameB = '<b data-profile="' + p.uid + '">' + esc(p.name) + '</b>';
    if (it.type === 'ach') {
      html += '<div class="post ach"><div class="top"><div class="ic">' + it.a.icon + '</div><div class="tx">' + nameB +
        ' получает достижение «' + esc(it.a.name) + '»<div class="meta">' + esc(it.a.desc) + ' · ' + ago + ' назад</div></div></div></div>';
      return;
    }
    const dur = p.durMap[it.t], key = p.uid + '_' + it.t, rs = M.byEvent[key] || [];
    const mineR = rs.find(r => r.by === me.uid);
    let txt = nameB + ' ' + (dur ? 'покакал, заседал ' + durText(dur) : 'покакал');
    const idx = p.ev.indexOf(it.t);
    if (idx > 0) { const gap = it.t - p.ev[idx-1]; if (gap >= 36 * H) txt += ' — первый раз за ' + human(gap) + '!'; }
    let btns = '';
    EMOJIS.forEach(e => {
      const c = rs.filter(r => r.emoji === e).length;
      if (isMe && !c) return;
      btns += '<button data-react="' + e + '" data-owner="' + p.uid + '" data-ts="' + it.t + '" class="' + (mineR && mineR.emoji === e ? 'mine' : '') + '"' + (isMe ? ' disabled' : '') + '>' + e + (c ? '<span>' + c + '</span>' : '') + '</button>';
    });
    const whoR = rs.map(r => (M.per[r.by] ? M.per[r.by].name : 'кто-то') + ' ' + r.emoji).join(', ');
    html += '<div class="post"><div class="top"><div class="ic">💩</div><div class="tx">' + txt +
      '<div class="meta">' + esc(whenText(it.t)) + ' · ' + ago + ' назад</div></div></div>' +
      (btns ? '<div class="reacts">' + btns + '</div>' : '') + (whoR ? '<div class="who-r">' + esc(whoR) + '</div>' : '') + '</div>';
  });
  if (items.length > feedLimit) html += '<div class="more"><button class="btn ghost" id="feedmore">Ещё новости</button></div>';
  return html;
}

function topView(){
  const rows = Object.values(M.per);
  if (!rows.length) return '<div class="center">Пока никого нет 🤷</div>';
  const cmp = {
    total:  (a,b) => b.n - a.n || (b.last||0) - (a.last||0),
    week:   (a,b) => b.week - a.week || b.n - a.n,
    streak: (a,b) => b.streak.cur - a.streak.cur || b.streak.best - a.streak.best,
    hold:   (a,b) => (a.last == null) - (b.last == null) || b.cur - a.cur
  }[sortBy];
  rows.sort(cmp);
  const lead = rows[0];
  const titles = { total:'Главный обосранец', week:'Обосранец недели', streak:'Самая засранная серия', hold:'Дольше всех терпит' };
  let kingSub, has;
  if (sortBy === 'total') { kingSub = lead.n + ' ' + plural(lead.n,'раз','раза','раз') + ' за всё время'; has = lead.n > 0; }
  else if (sortBy === 'week') { kingSub = lead.week + ' ' + plural(lead.week,'раз','раза','раз') + ' за 7 дней'; has = lead.week > 0; }
  else if (sortBy === 'streak') { kingSub = lead.streak.cur + ' ' + plural(lead.streak.cur,'день','дня','дней') + ' подряд'; has = lead.streak.cur > 0; }
  else { kingSub = 'не какает уже <span data-since="' + lead.last + '" data-fmt="human">' + human(lead.cur) + '</span>'; has = lead.last != null; }

  let items = '';
  rows.forEach((r, i) => {
    const rank = i < 3 ? ['🥇','🥈','🥉'][i] : (i + 1);
    let v, u;
    if (sortBy === 'total') { v = r.n; u = plural(r.n,'раз','раза','раз'); }
    else if (sortBy === 'week') { v = r.week; u = 'за неделю'; }
    else if (sortBy === 'streak') { v = r.streak.cur; u = plural(r.streak.cur,'день','дня','дней'); }
    else { v = r.last != null ? '<span data-since="' + r.last + '">' + compact(r.cur) + '</span>' : '—'; u = 'терпит'; }
    const badges = (r.streak.cur >= 2 ? ' 🔥' + r.streak.cur : '') + (r.session ? ' 🚽' : '');
    const sub = (r.last != null ? '<span data-since="' + r.last + '" data-fmt="human">' + human(r.cur) + '</span> назад' : 'ещё ни разу') + ' · 🏅' + r.achCount;
    items += '<li data-profile="' + r.uid + '" class="' + (r.uid === me.uid ? 'me' : '') + '"><div class="rank">' + rank + '</div>' +
      '<div class="pl"><div class="nm">' + esc(r.name) + badges + (r.uid === me.uid ? '<i>это ты</i>' : '') + '</div><div class="sb">' + sub + '</div></div>' +
      '<div class="sc"><div class="v">' + v + '</div><div class="u">' + u + '</div></div></li>';
  });
  const sb = (k, l) => '<button data-sort="' + k + '" class="' + (sortBy === k ? 'on' : '') + '">' + l + '</button>';
  return '<div class="sorts">' + sb('total','🏆 Всего') + sb('week','📅 Неделя') + sb('streak','🔥 Серия') + sb('hold','⏳ Терпит') + '</div>' +
    liveBox() +
    (has ? '<div class="card king"><div class="crown">' + ({ hold:'🧘', streak:'🔥' }[sortBy] || '👑') + '</div><div class="t">' + titles[sortBy] + '</div>' +
      '<div class="n">' + esc(lead.name) + '</div><div class="s">' + kingSub + '</div></div>' : '') +
    '<div class="card" style="padding:8px"><ul class="board">' + items + '</ul></div>' +
    '<div class="note">' + rows.length + ' ' + plural(rows.length,'участник','участника','участников') + ' · нажми на человека, чтобы открыть профиль</div>';
}

function barChart(id, title, vals, ticks, describe){
  const max = Math.max(...vals), sel = chartSel[id], n = vals.length;
  const bars = vals.map((v, i) => '<button class="bar' + (sel === i ? ' sel' : '') + '" data-chart="' + id + '" data-i="' + i + '" aria-label="' + esc(describe(i, v)) + '">' +
    '<span style="height:' + (v && max ? Math.max(4, v / max * 100) : 0) + '%"></span></button>').join('');
  const tk = ticks.map(([i, l]) => {
    const pos = (i + 0.5) / n * 100, edge = i === 0 ? 'transform:none;left:0' : i === n - 1 ? 'transform:none;left:auto;right:0' : 'left:' + pos + '%';
    return '<span style="' + edge + '">' + l + '</span>'; }).join('');
  const cap = sel != null ? '<b>' + esc(describe(sel, vals[sel])) + '</b>' : (max ? 'Пик: ' + max + ' · нажми на столбик' : 'Пока нет данных');
  return '<div class="card"><div class="ch-h"><h2>' + title + '</h2></div><div class="ch-cap">' + cap + '</div>' +
    '<div class="bars">' + bars + '</div><div class="ticks">' + tk + '</div></div>';
}

    '<span class="chip">🏅 ' + p.achCount + '/' + ACH.length + '</span>' + (p.gotCount ? '<span class="chip">👏 ' + p.gotCount + ' ' + plural(p.gotCount,'реакция','реакции','реакций') + '</span>' : '') + '</div></div>';

  html += '<div class="grid">' +
    '<div class="tile"><div class="v">' + (p.last != null ? '<span data-since="' + p.last + '">' + compact(p.cur) + '</span>' : '—') + '</div><div class="k">не какает</div></div>' +
    '<div class="tile"><div class="v">' + p.week + '</div><div class="k">за 7 дней</div></div>' +
    '<div class="tile"><div class="v">' + (p.avg != null ? shortH(p.avg) + ' <small>' + shortUnit(p.avg) + '</small>' : '—') + '</div><div class="k">средний перерыв</div></div>' +
    '<div class="tile"><div class="v">' + (p.n ? shortH(p.record) + ' <small>' + shortUnit(p.record) + '</small>' : '—') + '</div><div class="k">рекорд без какания</div></div></div>';

  // throne stats
  const ds = p.durs.map(([, s]) => s);
  if (ds.length) {
    const total = ds.reduce((a, b) => a + b, 0);
    html += '<div class="card"><h2>🚽 На троне</h2><div class="grid" style="margin:0">' +
      '<div class="tile"><div class="v">' + ds.length + '</div><div class="k">' + plural(ds.length,'заседание','заседания','заседаний') + ' с секундомером</div></div>' +
      '<div class="tile"><div class="v" style="font-size:20px">' + durText(total / ds.length) + '</div><div class="k">в среднем</div></div>' +
      '<div class="tile"><div class="v" style="font-size:20px">' + durText(Math.max(...ds)) + '</div><div class="k">самое долгое</div></div>' +
      '<div class="tile"><div class="v" style="font-size:20px">' + durText(total) + '</div><div class="k">всего на троне</div></div></div></div>';
  }

  // achievements
  let ach = '';
  ACH.forEach(a => {
    const t = p.achAt[a.id];
    ach += '<div class="ach-i' + (t ? '' : ' off') + '"><div class="e">' + a.icon + '</div><div class="n">' + esc(a.name) + '</div>' +
      '<div class="d">' + (t ? fmtDate.format(new Date(t)) : esc(a.desc)) + '</div></div>';
  });
  html += '<div class="card"><h2>🏅 Достижения · ' + p.achCount + ' из ' + ACH.length + '</h2><div class="achs">' + ach + '</div>' +
    '<div class="note" style="margin-top:10px">Серые — ещё не получены, под ними написано, что сделать.</div></div>';

  // charts
  const hours = Array(24).fill(0), wd = Array(7).fill(0), last30 = Array(30).fill(0), today = dayNum(M.now);
  p.ev.forEach(t => { const d = new Date(t); hours[d.getHours()]++; wd[(d.getDay() + 6) % 7]++; const k = today - dayNum(t); if (k >= 0 && k < 30) last30[29 - k]++; });
  const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], WDF = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
  html += barChart('h_' + uid, '🕐 Во сколько ходит', hours, [[0,'0:00'],[6,'6:00'],[12,'12:00'],[18,'18:00'],[23,'23:00']],
      (i, v) => pad(i) + ':00–' + pad((i + 1) % 24) + ':00 — ' + times(v)) +
    barChart('w_' + uid, '📅 По дням недели', wd, WD.map((l, i) => [i, l]), (i, v) => WDF[i] + ' — ' + times(v)) +
    barChart('d_' + uid, '📈 Последние 30 дней', last30, [[0,'30 дн. назад'],[15,'15'],[29,'сегодня']],
      (i, v) => { const t = M.now - (29 - i) * DAY; return (i === 29 ? 'Сегодня' : fmtDay.format(new Date(t))) + ' — ' + times(v); });

  if (mine) {
    html += (nameConflict ? '<div class="banner bad">⚠️ Такое имя уже есть у другого участника — придумай своё, чтобы вас не путали.</div>' : '') +
      '<div class="card"><h2>Имя в рейтинге</h2>' +
      '<div class="row" style="margin-top:0"><input id="newname" maxlength="24" value="' + esc(p.name) + '"><button class="btn" id="savename">Сохранить</button></div>' +
      '<div class="err" style="color:var(--ok)">' + esc(nameMsg) + '</div></div>' +
      '<div class="card" id="emailcard"><h2>📧 Почта для розыгрышей</h2>' +
        (priv && priv.email ? '<div style="font-size:14px;margin-bottom:8px">Сейчас: <b>' + esc(priv.email) + '</b></div>' : '<div class="gap" style="margin:-4px 0 8px">Будем писать только о розыгрышах и ивентах. Без спама.</div>') +
        '<input id="pemail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="name@mail.ru" value="' + esc(priv && priv.email || '') + '">' +
        '<label class="check"><input type="checkbox" id="pconsent"' + (priv && priv.consent ? ' checked' : '') + '><span>Согласен получать письма о розыгрышах и ивентах Калометра</span></label>' +
        '<div class="row"><button class="btn" id="saveemail" style="flex:1">Сохранить</button>' + (priv ? '<button class="btn ghost" id="delemail">Удалить</button>' : '') + '</div>' +
        '<div class="err" style="color:var(--ok)">' + esc(emailMsg) + '</div>' +
        '<div class="gap">Почту видишь только ты и организатор, в рейтинге её нет.</div></div>' +
      '<div class="card"><h2>Аккаунт</h2><div style="font-size:14px;color:var(--muted);margin-bottom:12px">Логин: <b style="color:var(--ink)">' + esc(me.login) + '</b></div>' +
      '<button class="btn ghost wide" id="logout">Выйти</button></div>' +
      tgPill('Обновления — в нашем Telegram') +
      '<div class="note">Чтобы позвать друзей — скинь им ссылку на этот сайт.</div>';
  }
  return html;
}

function render(){
  const keep = {};
  const keepChk = {};
  app.querySelectorAll('input[id]').forEach(i => { if (i.type === 'checkbox') keepChk[i.id] = i.checked; else keep[i.id] = i.value; });
  const focusId = document.activeElement && document.activeElement.id;

  if (!me) { app.innerHTML = authView(); }
  else {
    M = buildModel();
    let body;
    if (fatal) body = '<div class="center">⚠️ ' + esc(fatal) + '</div>';
    else if (!loaded) body = '<div class="center">Загружаю данные… 💩</div>';
    else body = (rulesOld ? '<div class="banner bad">⚠️ Новые функции (реакции, секундомер) пока не работают: владельцу сайта нужно обновить правила Firestore.</div>' : '') +
      (view === 'top' ? topView() : view === 'feed' ? feedView() : view === 'profile' ? profileView(profileUid || me.uid) : meView());
    const p = M.per[me.uid];
    const tab = (v, ic, l, on) => '<button data-view="' + v + '" class="' + (on ? 'on' : '') + '"><b>' + ic + '</b>' + l + '</button>';
    app.innerHTML = '<div class="wrap"><header><h1><img src="favicon.png" alt="">Калометр</h1><div class="hr"><div class="who">' + esc(p ? p.name : me.login) + '</div>' + tgIcon() + '</div></header>' + body + '</div>' +
      '<nav class="tabs">' + tab('me','💩','Я', view === 'me') + tab('feed','🧻','Газета', view === 'feed') +
      tab('top','🏆','Рейтинг', view === 'top') + tab('myprofile','👤','Профиль', view === 'profile' && profileUid === me.uid) + '</nav>';
  }
  Object.keys(keep).forEach(id => { const el = document.getElementById(id); if (el && keep[id]) el.value = keep[id]; });
  Object.keys(keepChk).forEach(id => { const el = document.getElementById(id); if (el) el.checked = keepChk[id]; });
  if (focusId) { const f = document.getElementById(focusId); if (f && f.focus) f.focus(); }
  tick();
}

function tick(){
  const now = Date.now(), el = id => document.getElementById(id);
  const d = myData();
  if (d) {
    const ev = clean(d.events), last = ev.length ? Math.max(...ev) : null;
    if (last != null && el('td')) {
      const p = split(now - last);
      el('td').textContent = p.d; el('cd').textContent = plural(p.d,'день','дня','дней');
      el('th').textContent = pad(p.h); el('tm').textContent = pad(p.m); el('ts').textContent = pad(p.s);
      const st = status(now - last), se = el('st');
      if (se && se.textContent !== st[1]) { se.className = 'status ' + st[0]; se.textContent = st[1]; }
    }
    const ss = activeSession(d);
    if (ss && now - ss >= SESSION_MAX) { autoCloseSession(ss); if (el('sdone')) { render(); return; } }
  }
  const go = el('go');
  if (go) {
    const left = cooldownLeft(), label = left > 0 ? '⏳ Перерыв ' + left + ' с' : '💩 Покакал!';
    if (go.textContent !== label) go.textContent = label;
    go.classList.toggle('cool', left > 0);
  }
  document.querySelectorAll('[data-since]').forEach(n => {
    const ms = now - Number(n.dataset.since);
    n.textContent = n.dataset.fmt === 'human' ? human(ms) : compact(ms);
  });
  document.querySelectorAll('[data-clock]').forEach(n => { n.textContent = clock(now - Number(n.dataset.clock)); });
  document.querySelectorAll('[data-left]').forEach(n => { n.textContent = clock(Math.max(0, Number(n.dataset.left) - now)); });
}
setInterval(tick, 1000);

/* ---------- events ---------- */
app.addEventListener('toggle', e => { if (e.target.id === 'past') pastOpen = e.target.open; }, true);
app.addEventListener('submit', e => { if (e.target.id === 'authform') { e.preventDefault(); doAuth(); } });
app.addEventListener('click', e => {
  const t = e.target.closest('button, [data-profile]');
  if (!t) { if (armed) { armed = null; render(); } return; }
  if (t.dataset.mode) { mode = t.dataset.mode; authErr = ''; render(); return; }
  if (t.dataset.view) {
    if (t.dataset.view === 'myprofile') { view = 'profile'; profileUid = me.uid; }
    else view = t.dataset.view;
    armed = null; nameMsg = ''; emailMsg = ''; render(); window.scrollTo(0, 0); return;
  }
  if (t.dataset.profile) { view = 'profile'; profileUid = t.dataset.profile; nameMsg = ''; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.sort) { sortBy = t.dataset.sort; render(); return; }
  if (t.dataset.chart) { const i = Number(t.dataset.i); chartSel[t.dataset.chart] = chartSel[t.dataset.chart] === i ? null : i; render(); return; }
  if (t.dataset.react) { toggleReaction(t.dataset.owner, Number(t.dataset.ts), t.dataset.react); return; }
  const blocked = () => {
    const left = cooldownLeft();
    if (left <= 0) return false;
    showToast('Ты же только что это делал… 🤨 Попробуй через ' + left + ' ' + plural(left,'секунду','секунды','секунд'));
    t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
    return true;
  };
  if (t.id === 'go') {
    if (blocked()) return;
    lastTapAt = Date.now();
    const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2);
    addPoop(lastTapAt); armed = null; showToast('Записано! 💩'); tick(); return;
  }
  if (t.id === 'sstart') { if (blocked()) return; startSession(); showToast('Секундомер пошёл 🚽 Удачи!'); return; }
  if (t.id === 'sdone') {
    const start = activeSession(myData()); if (!start) return;
    const ms = Date.now() - start;
    if (ms >= SESSION_MAX) { autoCloseSession(start); return; }
    lastTapAt = Date.now();
    const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2);
    finishSession(start, ms / 1000); showToast('Записано! Заседание: ' + durText(ms / 1000) + ' 💩'); return;
  }
  if (t.id === 'scancel') { cancelSession(); showToast('Ложная тревога — ничего не записали'); return; }
  if (t.id === 'add') {
    const v = document.getElementById('dt').value, err = document.getElementById('err');
    let ts = v ? new Date(v).getTime() : NaN;
    if (isNaN(ts)) { err.textContent = 'Выбери дату и время'; return; }
    if (ts > Date.now() + 60000) { err.textContent = 'Из будущего какать нельзя 🙂'; return; }
    const reg = regAt();
    if (reg && ts < Math.floor(reg / 60000) * 60000) { err.textContent = 'Тебя тут ещё не было 🙂 Ты зарегистрировался ' + whenText(reg).toLowerCase() + ' — раньше ставить нельзя.'; return; }
    const have = new Set(clean(myData() && myData().events));
    while (have.has(ts)) ts += 1;
    addPoop(ts); pastOpen = false; showToast('Добавлено задним числом 🕐'); return;
  }
  if (t.id === 'more') { showAll = !showAll; render(); return; }
  if (t.id === 'feedmore') { feedLimit += 30; render(); return; }
  if (t.dataset.del) {
    const id = Number(t.dataset.del);
    if (armed === id) { armed = null; removePoop(id); } else { armed = id; render(); }
    return;
  }
  if (t.id === 'migrate') {
    const ev = legacyEvents();
    if (ev.length) fs.setDoc(myDoc(), { events: fs.arrayUnion(...ev), login: me.login }, { merge: true })
      .then(() => { lsSet(MIGRATED_LS, '1'); showToast('Перенесено: ' + ev.length); render(); }).catch(onWriteErr);
    return;
  }
  if (t.id === 'nomigrate') { lsSet(MIGRATED_LS, '1'); render(); return; }
  if (t.id === 'savename') {
    const nm = normName(document.getElementById('newname').value);
    const np = nameProblem(nm); if (np) { showToast(np); return; }
    if (nm === (myData() && myData().name) && !nameConflict) return;
    if (nameTakenLocally(nm)) { showToast('Имя «' + nm + '» уже занято 😏 Придумай другое'); return; }
    claimName(nm).then(() => { nameMsg = 'Сохранено ✓'; nameConflict = false; render(); })
      .catch(e => { if (e.taken) showToast('Имя «' + nm + '» уже занято 😏 Придумай другое');
        else if (isPerm(e)) { rulesOld = true; fs.setDoc(myDoc(), { name: nm }, { merge: true }).then(() => { nameMsg = 'Сохранено ✓'; render(); }).catch(onWriteErr); }
        else onWriteErr(e); });
    return;
  }
  if (t.id === 'saveemail') {
    const em = (document.getElementById('pemail').value || '').trim().toLowerCase();
    if (!EMAIL_RE.test(em)) { showToast('Почта выглядит неправильно'); return; }
    if (!document.getElementById('pconsent').checked) { showToast('Отметь согласие на письма о розыгрышах'); return; }
    savePrivate(em); lsSet(EMAIL_ASK_LS, '1'); return;
  }
  if (t.id === 'delemail') { fs.deleteDoc(fs.doc(fs.db, 'private', me.uid)).then(() => {
      const i = document.getElementById('pemail'), c = document.getElementById('pconsent'); if (i) i.value = ''; if (c) c.checked = false;
      emailMsg = 'Почта удалена'; render(); }).catch(onWriteErr); return; }
  if (t.id === 'askemail') { lsSet(EMAIL_ASK_LS, '1'); view = 'profile'; profileUid = me.uid; render(); const c = document.getElementById('emailcard'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (t.id === 'noemail') { lsSet(EMAIL_ASK_LS, '1'); render(); return; }
  if (t.id === 'logout') { view = 'me'; mode = 'login'; authErr = ''; fa.signOut(fa.auth); return; }
});

render();
</script>
</body>
</html>
